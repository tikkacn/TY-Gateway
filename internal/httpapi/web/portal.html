<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TY Gateway · 设备中心</title>
<style>
:root{--ink:#172033;--muted:#667085;--line:#e6eaf0;--brand:#5b4ce6;--brand-dark:#4435c4;--bg:#f6f7fb;--good:#147d52;--amber:#9b6500;--danger:#b42318}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.55 Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}button,input,select{font:inherit}button{cursor:pointer}.hidden{display:none!important}.wrap{width:min(1080px,calc(100% - 32px));margin:0 auto}.auth{min-height:100vh;display:grid;place-items:center;padding:28px}.auth-card,.card{background:#fff;border:1px solid var(--line);border-radius:16px;box-shadow:0 10px 28px rgba(25,33,61,.05)}.auth-card{width:min(430px,100%);padding:32px}.brand{display:flex;gap:11px;align-items:center;color:var(--brand-dark);font-weight:800;letter-spacing:.02em}.mark{width:34px;height:34px;border-radius:11px;background:var(--brand);color:#fff;display:grid;place-items:center;font-weight:800}.eyebrow{font-size:11px;text-transform:uppercase;letter-spacing:.11em;color:var(--brand);font-weight:750}.auth h1{margin:26px 0 7px;font-size:27px;letter-spacing:-.03em}.muted{color:var(--muted)}.field{display:grid;gap:7px;margin-top:18px}.field span{font-size:12px;font-weight:700;color:#344054}.field input,.field select{width:100%;min-height:42px;border:1px solid #cfd5df;border-radius:9px;padding:9px 11px;outline:none;background:#fff}.field input:focus,.field select:focus{border-color:var(--brand);box-shadow:0 0 0 3px rgba(91,76,230,.12)}.btn{border:0;border-radius:9px;padding:10px 15px;background:var(--brand);color:#fff;font-weight:700}.btn:hover{background:var(--brand-dark)}.btn.secondary{background:#fff;color:#475467;border:1px solid #cfd5df}.btn:disabled{opacity:.55;cursor:not-allowed}.auth .btn{width:100%;margin-top:22px}.fine{font-size:12px;margin-top:18px}.top{padding:21px 0 18px;background:#fff;border-bottom:1px solid var(--line)}.top-row{display:flex;justify-content:space-between;align-items:center;gap:16px}.top-actions{display:flex;gap:9px}.main{padding:28px 0 54px}.welcome{display:flex;justify-content:space-between;align-items:end;gap:16px;margin-bottom:20px}.welcome h1{margin:5px 0 0;font-size:27px;letter-spacing:-.035em}.grid{display:grid;grid-template-columns:1.15fr .85fr;gap:18px}.card{padding:22px}.card h2{font-size:17px;margin:0}.card p{margin:6px 0 0;color:var(--muted);font-size:13px}.device-hero{display:flex;align-items:center;justify-content:space-between;gap:18px;background:linear-gradient(135deg,#f0edff,#fff);border-color:#d9d3ff}.code-label{font-size:12px;color:var(--muted);font-weight:700}.code{font:800 28px/1.2 ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.07em;color:var(--brand-dark);margin-top:7px}.status{display:inline-flex;align-items:center;gap:7px;border-radius:99px;padding:5px 10px;font-size:12px;font-weight:750}.status.on{background:#eaf8f1;color:var(--good)}.status.off{background:#fef0ef;color:var(--danger)}.section-head{display:flex;justify-content:space-between;gap:14px;align-items:start;margin-bottom:16px}.form-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}.form-actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:16px}.rule-list{display:grid;gap:8px}.rule{border:1px solid var(--line);border-radius:10px;padding:11px 12px;display:flex;justify-content:space-between;gap:12px;align-items:center}.rule strong{display:block}.rule small{color:var(--muted)}.empty{padding:20px 0;color:var(--muted);font-size:13px}.notice{margin-top:14px;border-radius:10px;background:#f8f9fc;padding:11px 12px;color:var(--muted);font-size:12px}.toast{position:fixed;right:20px;bottom:20px;background:#172033;color:#fff;border-radius:10px;padding:12px 15px;max-width:340px;box-shadow:0 10px 28px rgba(0,0,0,.15);opacity:0;transform:translateY(8px);transition:.2s}.toast.show{opacity:1;transform:none}.error{color:var(--danger);font-size:12px;margin-top:10px;min-height:18px}@media(max-width:760px){.wrap{width:min(100% - 24px,560px)}.auth{padding:18px}.auth-card{padding:24px}.top-row,.welcome,.device-hero{align-items:flex-start;flex-direction:column}.top-actions{width:100%}.top-actions .btn{flex:1}.grid,.form-row{grid-template-columns:1fr}.main{padding-top:20px}.code{font-size:23px}}
</style>
</head>
<body>
<section id="auth" class="auth"><div class="auth-card"><div class="brand"><div class="mark">TY</div><div>TY Gateway</div></div><h1>设备中心</h1><p class="muted">使用管理员发给你的设备码和访问凭证登录。这里仅管理你自己的设备。</p><label class="field"><span>设备码</span><input id="deviceCode" autocomplete="username" placeholder="例如 AABBCCDDEE01"></label><label class="field"><span>访问凭证</span><input id="accessToken" type="password" autocomplete="current-password" placeholder="请输入访问凭证"></label><button id="login" class="btn">进入设备中心</button><div id="authError" class="error"></div><p class="fine muted">访问凭证只在本次浏览器会话中使用，不会保存到本地。</p></div></section>
<section id="app" class="hidden"><header class="top"><div class="wrap top-row"><div class="brand"><div class="mark">TY</div><div><div>TY Gateway</div><div class="muted" style="font-size:11px;font-weight:500">设备中心</div></div></div><div class="top-actions"><button id="refresh" class="btn secondary">刷新状态</button><button id="logout" class="btn secondary">退出</button></div></div></header><main class="main wrap"><div class="welcome"><div><div class="eyebrow">Customer portal</div><h1 id="hello">我的设备</h1></div><span id="topStatus" class="status off">未连接</span></div><div id="stateError" class="error"></div><div class="grid"><section class="card device-hero"><div><div class="code-label">你的设备码</div><div id="serial" class="code">—</div><div id="deviceName" class="muted" style="margin-top:8px">—</div></div><span id="deviceStatus" class="status off">离线</span></section><section class="card"><div class="section-head"><div><h2>临时全局模式</h2><p>仅在设定时间内生效，到期自动恢复。</p></div></div><div class="form-row"><label class="field" style="margin-top:0"><span>模式</span><select id="overrideAction"><option value="">跟随规则</option><option value="DIRECT">全局直连</option><option value="PROXY">全局代理</option></select></label><label class="field" style="margin-top:0"><span>持续时间</span><select id="overrideDuration"><option value="5">5 分钟</option><option value="10">10 分钟</option><option value="30">30 分钟</option><option value="60">1 小时</option><option value="180">3 小时</option><option value="360">6 小时</option></select></label></div><div class="form-actions"><button id="saveOverride" class="btn">应用临时模式</button><button id="cancelOverride" class="btn secondary">取消临时模式</button></div><div id="overrideHint" class="notice">当前跟随规则 Profile。</div></section><section class="card"><div class="section-head"><div><h2>我的规则</h2><p>添加域名规则，优先于基础策略。</p></div></div><div class="form-row"><label class="field" style="margin-top:0"><span>匹配方式</span><select id="ruleType"><option value="domain">完整域名</option><option value="domain_suffix">域名及子域名</option></select></label><label class="field" style="margin-top:0"><span>策略</span><select id="ruleAction"><option value="DIRECT">直连</option><option value="PROXY">代理</option><option value="AUTO">自动选择</option><option value="BLOCK">阻断</option></select></label></div><label class="field"><span>域名</span><input id="ruleValue" placeholder="例如 openai.com" autocomplete="off"></label><div class="form-actions"><button id="addRule" class="btn">添加规则</button></div><div id="rules" class="rule-list" style="margin-top:18px"></div></section><section class="card"><div class="section-head"><div><h2>规则集节点</h2><p>为可用规则集选择偏好的节点；不会显示订阅地址。</p></div></div><label class="field" style="margin-top:0"><span>规则集</span><select id="category"></select></label><label class="field"><span>节点</span><select id="node"></select></label><div class="form-actions"><button id="saveNode" class="btn">保存节点偏好</button></div><div id="nodeHint" class="notice">没有可用节点时，请联系管理员检查订阅状态。</div></section><section class="card"><div class="section-head"><div><h2>设备帮助</h2><p>远程请求设备重新获取配置或上报状态。</p></div></div><div class="form-actions"><button class="btn secondary" data-action="reload_config">重新获取配置</button><button class="btn secondary" data-action="report_status">请求状态上报</button></div></section></div></main></section><div id="toast" class="toast" role="status"></div>
<script>
(()=>{
const $=id=>document.getElementById(id);
let session='',state=null,generation=0,editID='',loading=false;
const categories=['China','Google','YouTube','OpenAI','Telegram','GitHub','Netflix','Disney','Microsoft','Apple','Steam','Advertising'];
const esc=v=>String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
function toast(title,detail=''){const n=$('toast');n.textContent=detail?title+' · '+detail:title;n.classList.add('show');setTimeout(()=>n.classList.remove('show'),3500)}
async function api(path,options={}){
 const version=generation,headers={'Content-Type':'application/json'};
 if(session)headers.Authorization='Bearer '+session;
 const controller=new AbortController(),timer=setTimeout(()=>controller.abort(),15000);
 try{
  const r=await fetch('/api/v1'+path,{...options,headers,signal:controller.signal});
  const data=await r.json().catch(()=>({}));
  if(version!==generation)throw Error('登录状态已改变，请重试');
  if(!r.ok){
   if((r.status===401||r.status===403)&&session)showAuth();
   const messages={400:'请检查输入：域名不应包含网址前缀、路径或空格',401:'设备码或访问凭证不正确',403:'设备不可用或凭证已更新，请重新登录',404:'规则或节点已不可用，请刷新',409:'规则已存在或已达到数量上限',429:'操作太频繁，请一分钟后再试'};
   throw Error(messages[r.status]||'服务暂时不可用，请稍后重试');
  }
  return data;
 }catch(e){if(e.name==='AbortError')throw Error('请求超时，请检查连接后重试');throw e}
 finally{clearTimeout(timer)}
}
function showAuth(){
 generation++;session='';state=null;editID='';$('app').classList.add('hidden');$('auth').classList.remove('hidden');
 ['accessToken','ruleValue'].forEach(id=>$(id).value='');
 ['rules','category','node','ruleAction'].forEach(id=>$(id).replaceChildren());
 ['serial','deviceName','hello','overrideHint','nodeHint','stateError','authError'].forEach(id=>$(id).textContent='');
 $('addRule').textContent='添加规则';
}
function option(value,label){return '<option value="'+esc(value)+'">'+esc(label)+'</option>'}
function selectPreference(){$('node').value=state?.preferences?.[$('category').value]||'';if($('node').selectedIndex<0)$('node').value=''}
function render(){
 const d=state.device,category=$('category').value,action=$('ruleAction').value;
 if(!$('policyApplicationStatus')){const note=document.createElement('div');note.id='policyApplicationStatus';note.className='notice';note.setAttribute('role','status');note.textContent='策略功能尚未接入设备转发：自定义规则、临时全局模式和规则集节点偏好可以保存，但目前不会改变设备实际上网。';$('app').querySelector('.welcome').after(note)}
 if(!$('customerScopeNote')){const scope=document.createElement('div');scope.id='customerScopeNote';scope.className='notice';scope.textContent='本页面只管理本设备的上网规则、临时代理模式和规则集节点。订阅地址、账户信息、管理员备注及完整节点凭据由服务商管理，这里不会显示或修改。';$('stateError').before(scope)}
 $('overrideAction').closest('.card').querySelector('.section-head p').textContent='设置会同步到设备；只有 Agent 已升级且本机代理安全闸经现场确认解除后，代理模式才会改变实际转发。';
 $('ruleValue').closest('.card').querySelector('.section-head p').textContent='规则会同步到设备策略；当前 OEC 尚未接收新版 Agent，实际流量不变。';
 $('category').closest('.card').querySelector('.section-head p').textContent='偏好会随设备策略下发；完整节点清单和设备侧应用仍待验证。';
 $('serial').textContent=d.serial;$('deviceName').textContent=d.name||'未命名设备';$('hello').textContent=d.name||'我的设备';
 ['deviceStatus','topStatus'].forEach(id=>{$(id).textContent=d.online?'设备在线':'设备离线';$(id).className='status '+(d.online?'on':'off')});
 $('overrideAction').value=d.customer_override_action||'';
 $('overrideHint').textContent=d.customer_override_action?'已保存临时'+(d.customer_override_action==='PROXY'?'代理':'直连')+'设置，截止 '+new Date(d.customer_override_until).toLocaleString()+'；是否转发取决于设备端安全闸与同步状态。':'当前跟随基础规则。控制面配置版本 '+d.config_version+'；设备端状态需以实际部署为准。';
 $('rules').innerHTML=(state.rules||[]).map(r=>'<div class="rule"><div><strong>'+esc(r.match_value)+'</strong><small>'+esc(r.match_type==='domain'?'完整域名':r.match_type==='domain_suffix'?'含子域名':'IP/CIDR')+' · '+esc(r.action)+'</small></div><div><button class="btn secondary" data-edit-rule="'+esc(r.id)+'">编辑</button> <button class="btn secondary" data-delete-rule="'+esc(r.id)+'">删除</button></div></div>').join('')||'<div class="empty">还没有自定义规则。最多可添加 200 条。</div>';
 const available=d.profile==='gfw_precise'?['GFW']:categories;
 $('category').innerHTML=available.map(c=>option(c,c)).join('');
 if(available.includes(category))$('category').value=category;
 $('node').innerHTML=option('','自动选择（跟随基础策略）')+state.nodes.map(n=>option(n.id,n.name||n.id)).join('');
 selectPreference();$('saveNode').disabled=false;
 $('nodeHint').textContent=state.nodes.length?'选择仅对当前设备生效；设备是否能实际使用取决于同步状态及本机安全闸。':'暂无可用节点，可恢复自动选择，或联系管理员检查订阅。';
 $('ruleAction').innerHTML=option('DIRECT','直连')+option('PROXY','代理')+option('AUTO','自动选择')+option('BLOCK','阻断')+
 [...new Set(state.nodes.map(n=>n.group).filter(Boolean))].map(g=>option('GROUP:'+g,'节点组 · '+g)).join('')+
 state.nodes.map(n=>option('NODE:'+n.id,'节点 · '+(n.name||n.id))).join('');
 if([...$('ruleAction').options].some(o=>o.value===action))$('ruleAction').value=action;
}
async function load(){const version=generation;const result=await api('/customer/me');if(version!==generation)return;state=result;render();$('stateError').textContent=''}
async function run(button,action){
 if(button.disabled)return;button.disabled=true;
 try{await action()}catch(e){$('stateError').textContent=e.message;toast('未完成',e.message)}
 finally{button.disabled=false}
}
$('login').addEventListener('click',()=>run($('login'),async()=>{
 const code=$('deviceCode').value.trim(),token=$('accessToken').value.trim();
 if(!code||!token){$('authError').textContent='请填写设备码和访问凭证';return}
 try{const r=await api('/customer/login',{method:'POST',body:JSON.stringify({device_code:code,access_token:token})});session=r.session_token;$('accessToken').value='';await load();$('auth').classList.add('hidden');$('app').classList.remove('hidden')}
 catch(e){$('authError').textContent=e.message;session='';generation++}
}));
$('accessToken').addEventListener('keydown',e=>{if(e.key==='Enter')$('login').click()});
$('logout').addEventListener('click',()=>run($('logout'),async()=>{await api('/customer/logout',{method:'POST',body:'{}'});showAuth();toast('已退出','此设备的其他客户会话也已退出')}));
$('refresh').addEventListener('click',()=>run($('refresh'),load));
async function save(path,body){await api(path,{method:'POST',body:JSON.stringify(body)});await load();toast('已保存到控制平面','设备端策略尚未应用，当前实际上网不变')}
$('cancelOverride').addEventListener('click',()=>run($('cancelOverride'),()=>save('/customer/override',{action:'',duration_minutes:0})));
$('saveOverride').addEventListener('click',()=>run($('saveOverride'),()=>save('/customer/override',{action:$('overrideAction').value,duration_minutes:Number($('overrideDuration').value)})));
const ipCidrOption=document.createElement('option');ipCidrOption.value='cidr';ipCidrOption.textContent='IP 地址 / CIDR 网段';$('ruleType').append(ipCidrOption);
const ruleValueLabel=$('ruleValue').closest('label').querySelector('span');
function updateRuleMatchInput(){const isIP=$('ruleType').value==='cidr';ruleValueLabel.textContent=isIP?'IP 地址 / CIDR':'域名';$('ruleValue').placeholder=isIP?'例如 203.0.113.10 或 2001:db8::/32':'例如 openai.com'}
$('ruleType').addEventListener('change',updateRuleMatchInput);updateRuleMatchInput();
$('addRule').addEventListener('click',()=>run($('addRule'),async()=>{
 await save('/customer/rules',{id:editID,match_type:$('ruleType').value,match_value:$('ruleValue').value.trim(),action:$('ruleAction').value});
 editID='';$('ruleValue').value='';$('addRule').textContent='添加规则';
}));
$('category').addEventListener('change',selectPreference);
$('saveNode').addEventListener('click',()=>run($('saveNode'),()=>save('/customer/node-preference',{category:$('category').value,node_id:$('node').value})));
document.body.addEventListener('click',e=>{
 const edit=e.target.closest('[data-edit-rule]');
 if(edit){const r=state.rules.find(r=>r.id===edit.dataset.editRule);if(!r)return;editID=r.id;$('ruleType').value=r.match_type;updateRuleMatchInput();$('ruleValue').value=r.match_value;$('ruleAction').value=r.action;$('addRule').textContent='保存修改';$('ruleValue').focus()}
 const del=e.target.closest('[data-delete-rule]');
 if(del&&confirm('确定删除这条规则？'))run(del,async()=>{await save('/customer/rules/delete',{id:del.dataset.deleteRule});if(editID===del.dataset.deleteRule){editID='';$('ruleValue').value='';$('addRule').textContent='添加规则'}});
 const a=e.target.closest('[data-action]');
 if(a)run(a,async()=>{await api('/customer/action',{method:'POST',body:JSON.stringify({action:a.dataset.action})});toast('请求已排队','等待设备连接后处理')});
});
})();
</script>
</body></html>
